<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design previews: showcase</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Nunito:wght@500;700&display=block"
    />
    <link rel="stylesheet" href="app.css" />
    <style>
      body {
        width: 1600px;
        height: 735px;
        background: var(--stage);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 44px;
      }
      h1 {
        margin: 0;
      }
      .sub {
        margin: 10px 0 34px;
        color: var(--muted);
        font-size: 19px;
      }
      .grid {
        display: flex;
        gap: 28px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .clip {
        width: 282px;
        height: 536px;
        overflow: hidden;
        border-radius: 26px;
      }
      .clip img {
        display: block;
        width: 282px;
        margin-top: -12px;
      }
      figcaption {
        font:
          700 17px/1 'Nunito App',
          'Nunito',
          sans-serif;
      }
    </style>
  </head>
  <body class="light">
    <h1 class="title">Aer Remote</h1>
    <div class="sub body">
      <b class="bold" style="color: var(--deep-terracotta)">Design previews</b>, built from the
      app's real tokens and copy. Not device screenshots: v1 is awaiting a hardware test.
    </div>
    <div class="grid">
      <figure>
        <div class="clip"><img src="../screen-home.png" alt="" /></div>
        <figcaption>Home</figcaption>
      </figure>
      <figure>
        <div class="clip"><img src="../screen-dispenser.png" alt="" /></div>
        <figcaption>Dispenser</figcaption>
      </figure>
      <figure>
        <div class="clip"><img src="../screen-schedule.png" alt="" /></div>
        <figcaption>Schedule editor</figcaption>
      </figure>
      <figure>
        <div class="clip"><img src="../screen-settings.png" alt="" /></div>
        <figcaption>Settings</figcaption>
      </figure>
      <figure>
        <div class="clip"><img src="../screen-dispenser-dark.png" alt="" /></div>
        <figcaption>Dark theme</figcaption>
      </figure>
    </div>
  </body>
</html>
