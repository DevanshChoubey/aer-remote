<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aer Remote banner</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Nunito:wght@500;700&display=block"
    />
    <link rel="stylesheet" href="app.css" />
    <style>
      /* 1280 x 640: also used as the GitHub social preview, so keep text inside the middle. */
      body {
        width: 1280px;
        height: 640px;
        background: var(--bg);
        color: var(--ink);
        position: relative;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        background: var(--stage);
      }
      .b1 {
        width: 620px;
        height: 620px;
        right: -140px;
        top: -170px;
      }
      .b2 {
        width: 300px;
        height: 300px;
        left: -110px;
        bottom: -170px;
        background: var(--soft);
      }
      .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 110px;
      }
      .icon {
        width: 300px;
        height: 300px;
        border-radius: 68px;
        box-shadow:
          var(--card-shadow),
          0 24px 50px -20px rgba(61, 34, 22, 0.35);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .name {
        font-size: 92px;
        line-height: 1;
        margin: 0 0 22px;
      }
      .tag {
        font-size: 34px;
        line-height: 1.3;
        max-width: 640px;
        margin: 0 0 30px;
        font-weight: 700;
      }
      .pills {
        display: flex;
        gap: 12px;
      }
      .pill {
        font:
          700 19px/1 'Nunito App',
          'Nunito',
          sans-serif;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .pill.accent {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--deep-terracotta);
      }
      .fine {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26px;
        text-align: center;
        font:
          500 16px/1 'Nunito App',
          'Nunito',
          sans-serif;
        color: var(--muted);
      }
    </style>
  </head>
  <body class="light">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="wrap">
      <img class="icon" src="../../../assets/images/icon.png" alt="" />
      <div>
        <h1 class="title name">Aer Remote</h1>
        <p class="body tag">A calm, offline remote for your Godrej aer Smart Matic</p>
        <div class="pills">
          <span class="pill accent">Bluetooth only</span>
          <span class="pill">No account</span>
          <span class="pill">iOS and Android</span>
        </div>
      </div>
    </div>
    <div class="fine">
      Works with the Godrej aer Smart Matic. Unofficial; not affiliated with or endorsed by Godrej.
    </div>
  </body>
</html>
